<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finanzas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mut:#6b7280;--pri:#0f766e;--onpri:#fff;--red:#b91c1c;--grn:#15803d;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b1115;--card:#151d23;--tx:#e8edf0;--mut:#93a1ab;--pri:#2dd4bf;--onpri:#062b28;--red:#f87171;--grn:#4ade80;--bd:#26323a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:18px;margin:0}
#st{font-size:12px;color:var(--mut)}
main{padding:0 16px 16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
input,select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.amt{font-size:32px;font-weight:700;text-align:center}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:600;margin-top:12px}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:11px}
nav button.on{color:var(--pri);font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.neg{color:var(--red)}.pos{color:var(--grn)}.mut{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--pri);margin-top:4px}
.big{font-size:22px;font-weight:700}
.mes{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mes b{text-transform:capitalize}
.warn{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.track{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}
.track>div{height:100%;background:var(--pri);border-radius:4px}
</style>
</head>
<body>
<header><h1>Finanzas</h1><span id="st"></span></header>
<main id="v"></main>
<nav>
<button data-v="in">Anotar</button>
<button data-v="rs">Resumen</button>
<button data-v="ct">Cartola</button>
<button data-v="cr">Fijos</button>
<button data-v="hs">Historial</button>
<button data-v="aj">Ajustes</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const clp=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-CL');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sh=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dd=(a,b)=>Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const dm=f=>f.slice(8)+'/'+f.slice(5,7);

const CG=['Supermercado','Cuentas básicas','Arriendo/Dividendo','Transporte','Combustible','Salud','Restaurantes','Ocio','Ropa','Hogar','Educación','Mascotas','Créditos/Cuotas','Suscripciones','Ahorro','Otros'];
const CI=['Sueldo','Retiro empresa','Honorarios','Ventas extra','Otros'];

let cfg=Object.assign({url:'',token:'',p1:'Franco',p2:'Pareja',me:''},LS('cfg')||{});
(function(){if(location.hash.indexOf('#cfg=')===0){try{const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5)))));Object.assign(cfg,c,{me:''});SV('cfg',cfg)}catch(e){}history.replaceState(null,'',location.pathname)}})();
let movs=LS('movs')||[],queue=LS('queue')||[];
let view='in',ym=today().slice(0,7);
let form={tipo:'G',cat:'',quien:cfg.me,ambito:'C',medio:'B',fecha:today(),monto:'',nota:''};
let cart={rows:[],hdr:0,map:{},res:null};
let creds=LS('creds')||[],pay=null,credForm=null,bver=LS('bver')||1;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}

/* ---------- sincronización ---------- */
async function api(body){
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},body,{token:cfg.token}))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
let flushing=false;
async function flush(){
  if(flushing||!cfg.url)return;flushing=true;
  try{while(queue.length){
    try{await api(queue[0])}catch(e){if(e.message==='accion'){toast('El script de Google está desactualizado');queue.shift();SV('queue',queue);continue}throw e}
    queue.shift();SV('queue',queue);
  }}catch(e){}
  flushing=false;updStat();
}
function updStat(){$('#st').textContent=!cfg.url?'sin planilla conectada':queue.length?queue.length+' por enviar':'al día'}
async function pull(){
  if(!cfg.url)return;
  await flush();if(queue.length)return;
  try{
    const j=await api({action:'list'});
    movs=j.movs;SV('movs',movs);
    bver=j.v||1;SV('bver',bver);
    if(j.creds){creds=j.creds;SV('creds',creds)}
    if(!(view==='cr'&&(credForm||pay))){if(view==='in')readForm();render()}
  }catch(e){updStat()}
}
function enqueue(op){queue.push(op);SV('queue',queue);updStat();flush()}
function addMovs(a){movs.push(...a);SV('movs',movs);enqueue({action:'addMany',movs:a})}
function delMov(id){movs=movs.filter(m=>m.id!==id);SV('movs',movs);enqueue({action:'del',id})}
function updMov(id,f){const m=movs.find(x=>x.id===id);if(m)Object.assign(m,f);SV('movs',movs);enqueue({action:'upd',id,fields:f})}

/* ---------- vistas ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#v').innerHTML=({in:vIn,rs:vRs,ct:vCt,cr:vCr,hs:vHs,aj:vAj})[view]();
  if(view==='ct')bindCt();
}
function chips(key,opts,sel){
  return '<div class="chips">'+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;
    return '<button class="chip '+(sel===v?'on':'')+'" data-a="set" data-k="'+key+'" data-v="'+esc(v)+'">'+esc(l)+'</button>'}).join('')+'</div>';
}
function movRow(m,del){
  const g=m.tipo==='G';
  return '<div class="row"><div><div>'+esc(m.cat)+(m.nota?' · '+esc(m.nota):'')+'</div><div class="mut">'+dm(m.fecha)+' · '+esc(m.quien)+' · '+(m.ambito==='C'?'compartido':'personal')+' · '+(m.medio==='E'?'efectivo':'banco')+(m.cartola?' · ✓ cartola':'')+'</div></div>'
   +'<div style="text-align:right"><div class="'+(g?'neg':'pos')+'">'+(g?'-':'+')+clp(Number(m.monto))+'</div>'
   +(del?'<button class="chip" style="padding:2px 8px;font-size:12px" data-a="del" data-id="'+esc(m.id)+'">borrar</button>':'')+'</div></div>';
}
function monthBar(){
  const lbl=new Date(ym+'-01T12:00:00').toLocaleDateString('es-CL',{month:'long',year:'numeric'});
  return '<div class="mes"><button class="chip" data-a="mes" data-d="-1">‹</button><b>'+lbl+'</b><button class="chip" data-a="mes" data-d="1">›</button></div>';
}

function vIn(){
  const cats=form.tipo==='G'?CG:CI;
  const rec=movs.slice().sort((a,b)=>String(b.ts).localeCompare(String(a.ts))).slice(0,5);
  return '<div class="card">'+chips('tipo',[['G','Gasto'],['I','Ingreso']],form.tipo)
  +'<div class="lbl">Monto (CLP)</div><input id="amt" class="amt" inputmode="numeric" placeholder="$ 0" autocomplete="off" value="'+esc(form.monto)+'"><div id="amtp" class="mut" style="text-align:center;min-height:20px;margin-top:4px">'+prev(form.monto)+'</div>'
  +'<div class="lbl">Categoría</div>'+chips('cat',cats,form.cat)
  +'<div class="lbl">'+(form.tipo==='G'?'Quién pagó':'Quién recibió')+'</div>'+chips('quien',[cfg.p1,cfg.p2],form.quien)
  +'<div class="lbl">Ámbito</div>'+chips('ambito',[['C','Compartido'],['P','Personal']],form.ambito)
  +'<div class="lbl">Medio</div>'+chips('medio',[['B','Banco / tarjeta'],['E','Efectivo']],form.medio)
  +'<div class="lbl">Fecha</div><input id="fec" type="date" value="'+form.fecha+'">'
  +'<div class="lbl">Nota (opcional)</div><input id="nota" value="'+esc(form.nota)+'" placeholder="ej: feria, bencina">'
  +'<button class="btn" data-a="save">Guardar</button></div>'
  +(rec.length?'<div class="card"><b>Últimos</b>'+rec.map(m=>movRow(m,false)).join('')+'</div>':'');
}

function vRs(){
  const L=movs.filter(m=>String(m.fecha).startsWith(ym));
  const sum=a=>a.reduce((s,m)=>s+Number(m.monto),0);
  const I=L.filter(m=>m.tipo==='I'),G=L.filter(m=>m.tipo==='G');
  const ti=sum(I),tg=sum(G);
  const per=p=>{const i=sum(I.filter(m=>m.quien===p)),g=sum(G.filter(m=>m.quien===p));
    return '<div class="card"><b>'+esc(p)+'</b><div class="row"><span>Ingresos</span><span class="pos">'+clp(i)+'</span></div><div class="row"><span>Gastos pagados</span><span class="neg">'+clp(g)+'</span></div><div class="row"><span>Diferencia</span><b>'+clp(i-g)+'</b></div></div>'};
  const sc=G.filter(m=>m.ambito==='C');
  const c1=sum(sc.filter(m=>m.quien===cfg.p1)),c2=sum(sc.filter(m=>m.quien===cfg.p2)),d=(c1-c2)/2;
  const aj=!sc.length?'':Math.abs(d)<1?'Parejos en lo compartido.':d>0?esc(cfg.p2)+' le debe '+clp(d)+' a '+esc(cfg.p1):esc(cfg.p1)+' le debe '+clp(-d)+' a '+esc(cfg.p2);
  const bc={};G.forEach(m=>bc[m.cat]=(bc[m.cat]||0)+Number(m.monto));
  const cats=Object.entries(bc).sort((a,b)=>b[1]-a[1]);const mx=cats.length?cats[0][1]:1;
  const ef=sum(G.filter(m=>m.medio==='E'));
  return monthBar()
  +'<div class="card"><div class="row"><span>Ingresos</span><span class="big pos">'+clp(ti)+'</span></div><div class="row"><span>Gastos</span><span class="big neg">'+clp(tg)+'</span></div><div class="row"><span>Saldo del mes</span><span class="big '+(ti-tg<0?'neg':'pos')+'">'+clp(ti-tg)+'</span></div></div>'
  +credMes()+chartMeses()+donut(cats,tg)+per(cfg.p1)+per(cfg.p2)
  +(aj?'<div class="card"><b>Compartido</b><div class="row"><span>Total compartido</span><span>'+clp(sum(sc))+'</span></div><div class="mut" style="margin-top:6px">'+aj+' (supone mitad y mitad)</div></div>':'')
  +'<div class="card"><b>Por medio</b><div class="row"><span>Efectivo</span><span>'+clp(ef)+'</span></div><div class="row"><span>Banco / tarjeta</span><span>'+clp(tg-ef)+'</span></div></div>';
}

function vHs(){
  const L=movs.filter(m=>String(m.fecha).startsWith(ym)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||String(b.ts).localeCompare(String(a.ts)));
  return monthBar()+'<div class="card">'+(L.length?L.map(m=>movRow(m,true)).join(''):'<div class="mut">Sin movimientos este mes.</div>')+'</div>';
}

function vCt(){
  const r=cart.res;
  let h='<div class="card"><b>Conciliar cartola</b><div class="mut">Sube la cartola del banco (CSV o Excel). Se compara con lo anotado como banco/tarjeta; el efectivo no se espera en la cartola.</div><input id="file" type="file" accept=".csv,.txt,.xlsx,.xls" style="margin-top:10px"></div>';
  if(cart.rows.length&&!r){
    const H=(cart.rows[cart.hdr]||[]).map(String);
    const sel=(k,l)=>'<div class="lbl">'+l+'</div><select data-m="'+k+'"><option value="-1">—</option>'+H.map((x,i)=>'<option value="'+i+'" '+(cart.map[k]===i?'selected':'')+'>'+esc(x||('columna '+(i+1)))+'</option>').join('')+'</select>';
    h+='<div class="card"><b>Columnas</b><div class="mut">Si el banco separa cargos y abonos, elige ambas y deja Monto en —.</div>'+sel('f','Fecha')+sel('d','Descripción')+sel('m','Monto (con signo)')+sel('c','Cargos')+sel('a','Abonos')+'<button class="btn" data-a="conc">Conciliar</button></div>';
  }
  if(r){
    const tot=a=>a.reduce((s,m)=>s+Number(m.monto),0);
    h+='<div class="card"><b>Resultado '+dm(r.lo)+' al '+dm(r.hi)+'</b>'
    +'<div class="row"><span>Coinciden</span><b>'+(r.matched.length+r.done)+'</b></div>'
    +'<div class="row"><span>En cartola, sin anotar</span><b>'+r.nuevas.length+'</b></div>'
    +'<div class="row"><span>Anotados como banco, no aparecen</span><b>'+r.huer.length+'</b></div>'
    +'<div class="row"><span>Efectivo anotado (gastos)</span><b>'+clp(tot(r.efe))+'</b></div>'
    +(r.ya?'<div class="mut">'+r.ya+' líneas ya estaban conciliadas antes.</div>':'')
    +(r.allPos?'<div class="warn">Todos los montos salieron positivos: probablemente cargos y abonos vienen en columnas separadas. Vuelve a cargar y elige ambas columnas.</div>':'')+'</div>';
    if(r.matched.length)h+='<div class="card"><b>Coinciden ('+r.matched.length+')</b>'+r.matched.slice(0,40).map(x=>'<div class="row"><span>'+esc(x.m.cat)+' · '+esc(x.l.desc.slice(0,26))+'</span><span>'+clp(x.l.monto)+'</span></div>').join('')+'<button class="btn" data-a="okm">Marcar como conciliados</button></div>';
    if(r.nuevas.length){
      h+='<div class="card"><b>En cartola y sin anotar ('+r.nuevas.length+')</b><div class="mut">Elige categoría de cada una; se agregan como banco.</div>'
      +'<div class="lbl">Quién (para todas)</div><select data-rq="1"><option '+(r.quien===cfg.p1?'selected':'')+'>'+esc(cfg.p1)+'</option><option '+(r.quien===cfg.p2?'selected':'')+'>'+esc(cfg.p2)+'</option></select>'
      +'<div class="lbl">Ámbito (para todas)</div><select data-ra="1"><option value="C" '+(r.ambito==='C'?'selected':'')+'>Compartido</option><option value="P" '+(r.ambito==='P'?'selected':'')+'>Personal</option></select>';
      r.nuevas.forEach((l,i)=>{const cs=l.monto<0?CG:CI;
        h+='<div class="row" style="flex-direction:column"><div style="display:flex;justify-content:space-between"><span>'+dm(l.fecha)+' · '+esc(l.desc.slice(0,30))+'</span><b class="'+(l.monto<0?'neg':'pos')+'">'+clp(l.monto)+'</b></div><select data-nc="'+i+'">'+cs.map(c=>'<option '+((r.newCat[i]||'Otros')===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'});
      h+='<button class="btn" data-a="addn">Agregar las '+r.nuevas.length+'</button></div>';
    }
    if(r.huer.length)h+='<div class="card"><b>Anotados como banco y no aparecen ('+r.huer.length+')</b><div class="mut">Revisa: monto distinto, fecha lejana, o en realidad fue efectivo.</div>'
      +r.huer.map(m=>movRow(m,false)+'<div style="display:flex;gap:6px;margin-bottom:6px"><button class="chip" data-a="toE" data-id="'+esc(m.id)+'">Fue efectivo</button><button class="chip" data-a="delH" data-id="'+esc(m.id)+'">Borrar</button></div>').join('')+'</div>';
  }
  return h;
}

function vAj(){
  const o=(p)=>'<option value="'+esc(p)+'" '+(cfg.me===p?'selected':'')+'>'+esc(p)+'</option>';
  return '<div class="card"><div class="lbl">URL del Apps Script (termina en /exec)</div><input id="c_url" value="'+esc(cfg.url)+'" autocapitalize="off">'
  +'<div class="lbl">Token</div><input id="c_tok" value="'+esc(cfg.token)+'" autocapitalize="off">'
  +'<div class="lbl">Persona 1</div><input id="c_p1" value="'+esc(cfg.p1)+'">'
  +'<div class="lbl">Persona 2</div><input id="c_p2" value="'+esc(cfg.p2)+'">'
  +'<div class="lbl">¿Quién eres en este teléfono?</div><select id="c_me"><option value="">—</option>'+o(cfg.p1)+o(cfg.p2)+'</select>'
  +'<button class="btn" data-a="cfgsave">Guardar</button>'
  +'<button class="btn sec" data-a="cfgtest">Probar conexión</button>'
  +'<button class="btn sec" data-a="cfgshare">Copiar enlace para mi pareja</button></div>'
  +'<div class="card mut">El enlace para tu pareja contiene el token: envíalo solo por un canal privado.</div>';
}

/* ---------- acciones ---------- */
function readForm(){const a=$('#amt'),n=$('#nota'),d=$('#fec');if(a)form.monto=a.value;if(n)form.nota=n.value;if(d)form.fecha=d.value||today()}
const act={
  set:d=>{readForm();form[d.k]=d.v;if(d.k==='tipo')form.cat='';render()},
  save:()=>{
    readForm();
    const monto=parseInt(String(form.monto).replace(/\D/g,''),10);
    if(!monto)return toast('Falta el monto');
    if(monto>=1000000&&!confirm('¿Confirmas $'+monto.toLocaleString('es-CL')+' ('+palabras(monto)+' pesos)?'))return;
    if(!form.cat)return toast('Elige categoría');
    if(!form.quien)return toast('Elige quién (o configúralo en Ajustes)');
    addMovs([{id:uid(),fecha:form.fecha,tipo:form.tipo,monto,cat:form.cat,quien:form.quien,ambito:form.ambito,medio:form.medio,nota:form.nota.trim(),cartola:'',ts:new Date().toISOString()}]);
    form.monto='';form.nota='';form.cat='';toast('Guardado');render();
  },
  mes:d=>{let y=+ym.slice(0,4),m=+ym.slice(5)+Number(d.d);if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+'-'+p2(m);render()},
  del:d=>{if(confirm('¿Borrar este movimiento?')){delMov(d.id);render()}},
  crnew:()=>{pay=null;credForm={id:''};render()},
  cedit:d=>{pay=null;credForm={id:d.id};render()},
  crcancel:()=>{credForm=null;render()},
  cdel:d=>{
    if(!confirm('¿Eliminar este registro? Los pagos ya registrados se mantienen en el historial.'))return;
    creds=creds.filter(x=>x.id!==d.id);SV('creds',creds);enqueue({action:'credDel',id:d.id});render();
  },
  crsave:()=>{
    if(bver<3)return toast('Primero actualiza el script de Google');
    readCredDraft();
    const d=credForm.d,es=d.tipo==='S';
    const nombre=d.nombre.trim(),cuota=Number(d.cuota)||0,total=es?0:(parseInt(d.total,10)||0),pag=es?0:(parseInt(d.pagadas0,10)||0);
    if(!nombre)return toast('Falta el nombre');
    if(!cuota)return toast(es?'Falta el monto del cobro':'Falta el valor de la cuota');
    if(!es&&(total<1||total>480))return toast('Revisa el total de cuotas');
    if(!d.primera)return toast(es?'Falta la fecha del próximo cobro':'Falta la fecha de la cuota 1');
    if(!es&&(pag<0||pag>total))return toast('Revisa las cuotas ya pagadas');
    const c={id:credForm.id||uid(),nombre:nombre,entidad:d.entidad.trim(),cuota:cuota,total:total,primera:d.primera,pagadas0:pag,quien:d.quien,ambito:d.ambito,ts:new Date().toISOString(),tipo:d.tipo,cada:es?(parseInt(d.cada,10)||1):1,cat:d.cat||(es?'Suscripciones':'Créditos/Cuotas')};

/* ---------- formato de montos ---------- */
function digits(v){return String(v==null?'':v).replace(/\D/g,'').replace(/^0+/,'').slice(0,9)}
function fmtMonto(v){const d=digits(v);return d?Number(d).toLocaleString('es-CL'):''}
function palabras(n){
  if(n===0)return 'cero';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const b=x=>{
    if(x===100)return 'cien';
    const c=Math.floor(x/100),r=x%100;let s=C[c];
    if(r){if(s)s+=' ';if(r<30)s+=U[r];else{s+=D[Math.floor(r/10)];if(r%10)s+=' y '+U[r%10]}}
    return s;
  };
  const un=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const mm=Math.floor(n/1e6),k=Math.floor((n%1e6)/1e3),u=n%1e3,p=[];
  if(mm)p.push(mm===1?'un millón':un(b(mm))+' millones');
  if(k)p.push(k===1?'mil':un(b(k))+' mil');
  if(u)p.push(b(u));
  return p.join(' ');
}
function prev(v){
  const d=digits(v);if(!d)return '';
  const n=Number(d);
  return '$'+n.toLocaleString('es-CL')+' · '+(n===1?'un peso':palabras(n)+' pesos');
}

  if(el.id==='payamt'||el.id==='cr_cuota'){el.value=fmtMonto(el.value);return}

  el.value=fmtMonto(el.value);form.monto=el.value;

});

const dmy=f=>f.slice(8)+'/'+f.slice(5,7)+'/'+f.slice(0,4);
function addMonths(s,k){
  const y=+s.slice(0,4),m=+s.slice(5,7)-1,d=+s.slice(8,10);
  const t=new Date(y,m+k,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last)));
}
function cuotasDe(c){
  const keys=new Set(movs.filter(m=>m.credito).map(m=>m.credito)),hoy=today(),out=[];
  const es=c.tipo==='S',cada=c.cada||1,lim=addMonths(hoy,13),viejo=addMonths(hoy,-2),max=es?600:c.total;
  for(let n=1;n<=max;n++){
    const f=addMonths(c.primera,(n-1)*cada);
    if(es&&f>lim)break;
    const pagada=n<=(c.pagadas0||0)||keys.has(c.id+'#'+n)||(es&&f<viejo);
    out.push({n:n,fecha:f,pagada:pagada,vencida:!pagada&&f<hoy});
  }
  return out;
}

function lastMonths(n){const out=[];let y=+ym.slice(0,4),m=+ym.slice(5);for(let i=0;i<n;i++){out.unshift(y+'-'+p2(m));m--;if(m<1){m=12;y--}}return out}

  const W=320,H=180,pt=14,pb=22,gw=W/6,bw=16,ph=H-pt-pb,mx=Math.max.apply(null,data.map(d=>Math.max(d.i,d.g)));

  });
  s+='</svg>';
  return '<div class="card"><b>Ingresos vs gastos</b><div class="mut">Últimos 6 meses hasta el mes seleccionado</div>'+s+'<div class="legend"><span><span class="sw" style="background:var(--grn)"></span>Ingresos</span><span><span class="sw" style="background:var(--red)"></span>Gastos</span></div></div>';
}
function donut(cats,tg){
  if(!cats.length||!tg)return '<div class="card"><b>Gastos por categoría</b><div class="mut">Sin gastos este mes.</div></div>';
  const items=cats.slice(0,6).map(c=>({n:c[0],v:c[1]})),rest=cats.slice(6).reduce((s,c)=>s+c[1],0);
  if(rest>0)items.push({n:'Otras',v:rest});
  let acc=0;
  const arcs=items.map((it,i)=>{const p=it.v/tg*100,a='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+PAL[i]+'" stroke-width="6" stroke-dasharray="'+p.toFixed(2)+' '+(100-p).toFixed(2)+'" stroke-dashoffset="'+(25-acc).toFixed(2)+'"/>';acc+=p;return a}).join('');
  const leg=items.map((it,i)=>'<div class="row" style="padding:5px 0"><span><span class="sw" style="background:'+PAL[i]+'"></span>'+esc(it.n)+'</span><span>'+clp(it.v)+' <span class="mut">'+Math.round(it.v/tg*100)+'%</span></span></div>').join('');
  return '<div class="card"><b>Gastos por categoría</b><svg viewBox="0 0 42 42" style="width:180px;display:block;margin:8px auto"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="6"/>'+arcs+'<text x="21" y="22.6" text-anchor="middle" style="fill:var(--tx);font-size:5px;font-weight:700">$'+compact(tg)+'</text></svg>'+leg+'</div>';
}

/* ---------- lectura de cartola ---------- */
function loadXlsx(){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function parseCsv(t){
  t=t.replace(/^\uFEFF/,'');
  const first=t.split(/\r?\n/).find(l=>l.trim())||'';
  const dl=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
    else c+=ch;
  }
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows;
}
async function readFile(f){
  if(/\.xlsx?$/i.test(f.name)){
    await loadXlsx();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  }
  return parseCsv(await f.text());
}
function autoMap(){
  let h=cart.rows.findIndex(r=>r.some(c=>/fecha/i.test(String(c))));if(h<0)h=0;cart.hdr=h;
  const H=(cart.rows[h]||[]).map(String),fi=re=>H.findIndex(c=>re.test(c));
  cart.map={f:fi(/fecha/i),d:fi(/descrip|detalle|glosa|movimiento|concepto/i),m:fi(/^(monto|importe)/i),c:fi(/cargo|giro|d[eé]bito/i),a:fi(/abono|dep[oó]sito|cr[eé]dito/i)};
}
function bindCt(){
  const i=$('#file');if(!i)return;
  i.onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{cart.rows=await readFile(f);autoMap();cart.res=null;render()}catch(err){toast('No pude leer el archivo')}};
}
function pd(v){
  if(v instanceof Date){const d=new Date(v.getTime()+43200000);return ymd(d)}
  const s=String(v==null?'':v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+p2(+m[2])+'-'+p2(+m[1])}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:null;
}
function pn(v){
  if(typeof v==='number')return v;
  let s=String(v==null?'':v).trim();if(!s)return 0;
  const neg=/^\(.*\)$/.test(s)||/^-|-$/.test(s);
  s=s.replace(/[^\d.,]/g,'');
  if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/[.,]/g,'');
  const n=parseFloat(s);return isNaN(n)?0:(neg?-n:n);
}
function buildLines(){
  const M=cart.map,out=[],seen={};
  cart.rows.slice(cart.hdr+1).forEach(r=>{
    const fe=pd(r[M.f]);if(!fe)return;
    let mo=M.m>=0?pn(r[M.m]):0;
    if(!mo&&(M.c>=0||M.a>=0))mo=(M.a>=0?Math.abs(pn(r[M.a])):0)-(M.c>=0?Math.abs(pn(r[M.c])):0);
    if(!mo)return;
    const de=String(r[M.d]==null?'':r[M.d]).trim(),base=fe+'|'+mo+'|'+de;
    seen[base]=(seen[base]||0)+1;
    out.push({fecha:fe,desc:de,monto:mo,key:base+'|'+seen[base]});
  });
  return out;
}
